<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Calculator</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e293b);
        }

        .calculator{
            background:#111827;
            padding:25px;
            border-radius:20px;
            box-shadow:0 0 20px rgba(0,0,0,0.5);
            width:350px;
        }

        .display{
            width:100%;
            height:80px;
            margin-bottom:20px;
            border:none;
            outline:none;
            border-radius:10px;
            padding:20px;
            font-size:32px;
            text-align:right;
            background:#e5e7eb;
            color:#111827;
        }

        .buttons{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:15px;
        }

        button{
            height:70px;
            border:none;
            border-radius:12px;
            font-size:24px;
            cursor:pointer;
            transition:0.2s;
        }

        button:hover{
            transform:scale(1.05);
        }

        .number{
            background:#374151;
            color:white;
        }

        .operator{
            background:#2563eb;
            color:white;
        }

        .equal{
            background:#16a34a;
            color:white;
            grid-column:span 2;
        }

        .clear{
            background:#dc2626;
            color:white;
        }

    </style>

</head>

<body>

    <div class="calculator">

        <input type="text" id="display" class="display" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendValue('/')">/</button>
            <button class="operator" onclick="appendValue('*')">*</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <button class="number" onclick="appendValue('7')">7</button>
            <button class="number" onclick="appendValue('8')">8</button>
            <button class="number" onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button class="number" onclick="appendValue('4')">4</button>
            <button class="number" onclick="appendValue('5')">5</button>
            <button class="number" onclick="appendValue('6')">6</button>
            <button class="number" onclick="appendValue('.')">.</button>

            <button class="number" onclick="appendValue('1')">1</button>
            <button class="number" onclick="appendValue('2')">2</button>
            <button class="number" onclick="appendValue('3')">3</button>
            <button class="number" onclick="appendValue('0')">0</button>

            <button class="equal" onclick="calculate()">=</button>

        </div>

    </div>

    <script>

        let display = document.getElementById("display");

        function appendValue(value){
            display.value += value;
        }

        function clearDisplay(){
            display.value = "";
        }

        function calculate(){

            try{
                display.value = eval(display.value);
            }

            catch(error){
                display.value = "Error";
            }

        }

    </script>

</body>

</html>
